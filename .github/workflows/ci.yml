name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not optional here. Three of the bugs found during
        # development were Windows-specific: a virtualized AppData path under
        # an MSIX install, an open SQLite file that cannot be replaced, and a
        # PowerShell installer that could not be run where it was written.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[eval,dev]"
      - run: python -m pytest tests -q
      - run: ruff check src eval scripts tests

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite. Claude Desktop 1.28929.0 bundles Node 24.
          node-version: "22.5"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Node tests
        run: node --test --no-warnings
        working-directory: node

  conformance:
    # The two implementations must agree exactly about what a name means. The
    # fixture is generated by Python and replayed by Node; if it is stale, a
    # change to normalization or the bloom filter has landed on one side only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: conformance fixture is current
        run: |
          python scripts/emit_conformance.py > /tmp/fresh.json
          if ! diff -q node/test/conformance.json /tmp/fresh.json; then
            echo "::error::node/test/conformance.json is stale."
            echo "Run: make conformance   (then re-run the Node tests)"
            diff node/test/conformance.json /tmp/fresh.json | head -40
            exit 1
          fi
